<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Product Card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card">
        <div class="image-section">
            <div class="inner-border">
                <img src="https://via.placeholder.com/150x100/FF7E67/FFFFFF?text=Sneaker" alt="Product">
            </div>
        </div>

        <div class="info-section">
            <h2 class="product-name">Lorem Ipsum<br>Dolor Sit</h2>
            <p class="product-desc">Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam</p>
            
            <div class="meta-row">
                <div class="price">$20</div>
                <div class="rating-group">
                    <div class="stars">★★★☆☆</div>
                    <div class="promo-text">Discount 50%</div>
                </div>
            </div>
        </div>

        <button class="cart-btn">ADD TO CART</button>
    </div>

</body>
</html>
