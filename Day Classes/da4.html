<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{
            border:1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <caption>Product Performance by Region</caption>
        <tr>
            <th>Product</th>
            <td colspan="4">Performance Metrics</td>
        </tr>
        <tr>
            <th>Region</th>
            <th>Q1</th>
            <th>Q2</th>
            <th>Q3</th>
            <th>Q4</th>
        </tr>
        <tr>
            <th rowspan="2">Product X</th>
            <td>$30,000</td>
            <td>$28,000</td>
            <td>$35,000</td>
            <td>$32,000</td>
        </tr>
        <tr>
            <td>95%</td>
            <td>92%</td>
            <td>98%</td>
            <td>94%</td>
        </tr>
    </table>
</body>
</html>
