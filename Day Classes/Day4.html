<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{
            border:1px solid black;
            border-collapse:collapse;
            text-align:center;
        }
        tr:nth-child(even), th:nth-child(even), td:nth-child(even){
            background-color:lightgreen
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th colspan="4">Colspan="4"</th>
        </tr>
        <tr>
            <td>col1</td>
            <td>col2</td>
            <td>col3</td>
            <td>col4</td>
        </tr>
        <tr>
            <td colspan="2">colspan=2</td>
            <td colspan="2">colspan=2</td>
        </tr>
        <tr>
            <td colspan="3">colspan3</td>
            <td>colspan1</td>
        </tr>
    </table>
    <br>
    <table>
        <tr>
            <th rowspan="2">Roll No.</th>
            <th rowspan="2">Name</th>
            <th colspan="2">Marks</th>
        </tr>
        <tr>
            <td>Java</td>
            <td>C++</td>
        </tr>
        <tr>
            <td>101</td>
            <td>John</td>
            <td>65</td>
            <td>75</td>
        </tr>
    </table>
    <br>
    <br>
    <table>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
        </tr>
        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
            <td>8</td>
        </tr>
        <tr>
            <td>9</td>
            <td>10</td>
            <td>11</td>
            <td>12</td>
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
            <td>16</td>
        </tr>
        <tr>
            <td>17</td>
            <td>18</td>
            <td>19</td>
            <td>20</td>
        </tr>
    </table>
    <br><br>
    <table>
        <colgroup>
            <col span="2"; style="background-color:blue">
            <col span="3"; style="visibility:collapse">
            <col span="2"; style="background-color:blue">
            </colgroup>
            <tr>
                <th>Sunday</th>
                <th>Monday</th>
                <th>Tuesday</th>    
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
                <th>Saturday</th>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
                <td>5</td>
                <td>6</td>
                <td>7</td>
        </tr>
        <tr>
            <td>8</td>
            <td>9</td>
            <td>10</td>
            <td>11</td>
            <td>12</td>
            <td>13</td>
            <td>14</td>
            </tr>
    </table>
</body>
</html>
